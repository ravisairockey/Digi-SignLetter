<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apology Letter - Superset Registration</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <!-- Using local anime.esm.js instead of GSAP -->
    <script type="module">
        import anime from './anime.esm.js';
        
        // Initialize animations
        document.addEventListener('DOMContentLoaded', () => {
            // Animate student info
            anime({
                targets: '#studentInfo',
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 800,
                delay: 300,
                easing: 'easeOutExpo'
            });
            
            // Animate letter content
            anime({
                targets: '#letterContent',
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 800,
                delay: 500,
                easing: 'easeOutExpo'
            });
            
            // Animate signature section
            anime({
                targets: '#signatureSection',
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 800,
                delay: 700,
                easing: 'easeOutExpo'
            });
            
            // Animate floating button
            anime({
                targets: '#toTopBtn',
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 500,
                delay: 1500,
                easing: 'easeOutBack'
            });
        });

        // Parallax effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            document.getElementById('parallaxBg').style.transform = `translate(${x * 20}px, ${y * 20}px)`;
        });

        // Back to top button animation
        document.getElementById('toTopBtn').addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
            
            anime({
                targets: '#toTopBtn',
                scale: [1, 0.9, 1],
                duration: 400,
                easing: 'easeInOutSine'
            });
        });

        // Signature clear button animation
        document.getElementById('clear-btn').addEventListener('click', () => {
            if (document.querySelectorAll('.signature-dot').length === 0) return;
            
            anime({
                targets: '#signature-pad',
                opacity: [1, 0.3, 1],
                duration: 600,
                easing: 'easeInOutSine',
                begin: function() {
                    document.getElementById('signature-pad').innerHTML = '<div class="signature-hint">Sign here</div>';
                    signaturePoints = [];
                }
            });
            
            anime({
                targets: '#clear-btn',
                scale: [1, 0.95, 1],
                duration: 400,
                easing: 'easeInOutSine'
            });
        });

        // Submit button animation
        document.getElementById('submit-btn').addEventListener('click', () => {
            if (signaturePoints.length === 0) {
                anime({
                    targets: '#signature-pad',
                    translateX: ['-5px', '5px', '-5px', '5px', '0px'],
                    duration: 400,
                    easing: 'easeInOutSine'
                });
                return;
            }
            
            anime({
                targets: '#submit-btn',
                scale: [1, 0.95],
                duration: 200,
                easing: 'easeInOutSine'
            });
        });

        // Letter container hover effect
        const letterContainer = document.getElementById('letter-container');
        letterContainer.addEventListener('mouseenter', () => {
            anime({
                targets: letterContainer,
                translateY: -5,
                rotateX: 1,
                boxShadow: '0 15px 35px rgba(0, 0, 0, 0.15)',
                duration: 500,
                easing: 'easeOutQuad'
            });
        });
        
        letterContainer.addEventListener('mouseleave', () => {
            anime({
                targets: letterContainer,
                translateY: 0,
                rotateX: 0,
                boxShadow: '0 10px 30px rgba(0, 0, 0, 0.1)',
                duration: 500,
                easing: 'easeOutQuad'
            });
        });
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        // Scroll progress bar
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('scrollProgress').style.width = scrolled + '%';
            
            // Show/hide back to top button
            if (winScroll > 300) {
                document.getElementById('toTopBtn').classList.add('visible');
            } else {
                document.getElementById('toTopBtn').classList.remove('visible');
            }
        });
